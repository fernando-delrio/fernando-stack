# Norma de estilo de Fernando (fernando-stack) para Python. Plantilla: copiar en la raíz del proyecto.
# Lo que Ruff no sabe comprobar (ningún else, ternario ni match, except solo en backend/intentar.py,
# 20 líneas por función y un nivel de bloques) lo vigila tests/test_norma_estilo.py (plantilla en
# esta misma carpeta).
# Excepciones de Ruff con su código y su porqué: `# noqa: N802 -- <porqué>`.
line-length = 100
target-version = "py313"

[lint]
select = [
  "F",       # errores y nombres sin usar
  "E", "W",  # estilo básico
  "B",       # errores típicos de Python
  "RET",     # return y else innecesarios
  "SIM",     # condiciones que se pueden simplificar
  "C901",    # complejidad
  "N",       # snake_case en funciones y variables, PascalCase en clases, UPPER_CASE en constantes
  "PLR0913", # (9) más de 3 parámetros piden un objeto
]
# Ruff format parte las líneas largas; los textos y el SQL largos se dejan enteros.
ignore = ["E501"]

[lint.mccabe]
max-complexity = 6

[lint.pylint]
max-args = 3

[lint.flake8-bugbear]
# Así declara FastAPI los parámetros de las rutas; no son llamadas peligrosas.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
